<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Operator — ASTRONET NEO RADAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 font-mono">
    <div class="w-full max-w-md rounded-2xl bg-slate-900/90 border border-cyan-500/30 p-6 shadow-2xl">
        <div class="mb-6">
            <p class="text-xs tracking-widest text-cyan-400 uppercase">ASTRONET // NEO RADAR</p>
            <h1 class="text-2xl font-bold text-white mt-1">OPERATOR LOGIN</h1>
            <p class="text-xs text-slate-400 mt-1">Masuk menggunakan akun yang telah didaftarkan.</p>
        </div>

        <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs border"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs text-cyan-300 mb-1">EMAIL / CALLSIGN</label>
                <input type="email" id="loginEmail" required placeholder="operator@astronet.local"
                    class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 focus:border-cyan-400 focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs text-cyan-300 mb-1">PASSWORD</label>
                <input type="password" id="loginPassword" required placeholder="••••••••"
                    class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 focus:border-cyan-400 focus:outline-none text-sm">
            </div>

            <button type="submit"
                class="w-full py-2.5 rounded-xl bg-indigo-500/25 hover:bg-indigo-500/35 border border-indigo-400/50 text-indigo-200 font-semibold text-sm transition">
                AUTHENTICATE
            </button>
        </form>

        <div class="mt-5 pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
            <span>Belum punya akun? <a href="./register.html" class="text-cyan-400 hover:underline">Register</a></span>
            <a href="./index.html" class="text-slate-300 hover:text-cyan-300">← Radar</a>
        </div>
    </div>

    <script>
        const USERS_KEY = 'astronet_users_v1';
        const SESSION_KEY = 'astronet_active_operator_v1';

        function showAlert(msg, isError = true) {
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden');
            box.className = `mb-4 p-3 rounded-xl text-xs border ${
                isError
                    ? 'bg-rose-500/15 border-rose-500/40 text-rose-300'
                    : 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
            }`;
            box.textContent = msg;
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
            const found = users.find(u => u.email === email && u.password === password);

            if (!found) {
                showAlert('Email atau password tidak cocok. Silakan cek kembali atau Register dulu.');
                return;
            }

            localStorage.setItem(SESSION_KEY, JSON.stringify({ name: found.name, email: found.email }));
            showAlert(`Selamat datang, ${found.name}! Mengalihkan ke radar...`, false);
            setTimeout(() => {
                window.location.href = './index.html';
            }, 700);
        });
    </script>
</body>
</html>
