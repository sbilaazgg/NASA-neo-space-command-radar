<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Operator Baru — ASTRONET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at 50% 20%, #071b2b 0%, #030912 70%);
        }
        .card-glow {
            background: rgba(7, 17, 29, 0.88);
            border: 1px solid rgba(34, 211, 238, 0.25);
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.12);
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 flex items-center justify-center p-4 font-mono">
    <div class="w-full max-w-md rounded-2xl card-glow p-7">
        <div class="flex flex-col items-center text-center mb-6">
            <h1 class="text-lg font-bold tracking-wider text-cyan-300 uppercase">REGISTER OPERATOR</h1>
            <p class="text-[11px] tracking-widest text-slate-400 uppercase mt-1">ASTRONET // NEO COMMAND TERMINAL</p>
        </div>

        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs border"></div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-[11px] tracking-wider text-cyan-300/90 uppercase mb-1.5">OPERATOR NAME</label>
                <input type="text" id="regName" required placeholder="Nama operator"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-[#050d18] border border-cyan-500/30 focus:border-cyan-400 focus:outline-none text-sm text-slate-100 placeholder-slate-500">
            </div>

            <div>
                <label class="block text-[11px] tracking-wider text-cyan-300/90 uppercase mb-1.5">OPERATOR EMAIL</label>
                <input type="email" id="regEmail" required placeholder="test@example.com"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-[#050d18] border border-cyan-500/30 focus:border-cyan-400 focus:outline-none text-sm text-slate-100 placeholder-slate-500">
            </div>

            <div>
                <label class="block text-[11px] tracking-wider text-cyan-300/90 uppercase mb-1.5">ACCESS PASSCODE</label>
                <input type="password" id="regPassword" required minlength="4" placeholder="••••••••"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-[#050d18] border border-cyan-500/30 focus:border-cyan-400 focus:outline-none text-sm text-slate-100 placeholder-slate-500">
            </div>

            <button type="submit"
                class="w-full py-2.5 mt-2 rounded-lg bg-cyan-950/70 hover:bg-cyan-900/70 border border-cyan-500/40 text-cyan-300 font-semibold text-xs tracking-widest uppercase transition">
                CREATE OPERATOR
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
            <span>Sudah punya akun? <a href="./login.html" class="text-cyan-400 hover:underline">Login</a></span>
            <a href="./index.html" class="text-cyan-400 hover:underline">← Kembali ke Radar</a>
        </div>
    </div>

    <script>
        const USERS_KEY = 'astronet_users_v1';
        const SESSION_KEY = 'astronet_active_operator_v1';

        function showAlert(msg, isError = true) {
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden');
            box.className = `mb-4 p-3 rounded-lg text-xs border ${
                isError
                    ? 'bg-rose-500/15 border-rose-500/40 text-rose-300'
                    : 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
            }`;
            box.textContent = msg;
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;

            const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
            if (users.some(u => u.email === email)) {
                showAlert('Email tersebut sudah terdaftar di browser ini.');
                return;
            }

            users.push({ name, email, password });
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            localStorage.setItem(SESSION_KEY, JSON.stringify({ name, email }));

            showAlert('Akun operator dibuat! Mengalihkan ke radar...', false);
            setTimeout(() => {
                window.location.href = './index.html';
            }, 600);
        });
    </script>
</body>
</html>
